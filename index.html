<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Doska Pro</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="theme-color" content="#15181f">
<style>
:root{--ui:#fff;--ui2:#eef1f5;--tx:#1d2330;--mut:#6b7280;--ac:#2563eb;--sh:0 10px 34px rgba(0,0,0,.16),0 1px 3px rgba(0,0,0,.08)}
body.dark{--ui:#232937;--ui2:#323a4c;--tx:#e8ebf2;--mut:#9aa3b5;--sh:0 10px 34px rgba(0,0,0,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#15181f;font-family:"Segoe UI",system-ui,Roboto,sans-serif;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;display:block}
#live{pointer-events:none}
.bar{position:fixed;display:flex;align-items:center;gap:3px;background:var(--ui);border-radius:20px;box-shadow:var(--sh);padding:6px;z-index:10;color:var(--tx)}
#tools{bottom:18px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
#topR{top:16px;right:16px}#topL{top:16px;left:16px}
.b{flex:none;width:54px;height:54px;border:0;background:transparent;border-radius:14px;display:grid;place-items:center;color:inherit;cursor:pointer;font:600 15px inherit;padding:0;transition:background .12s,transform .08s}
.b:active{transform:scale(.92)}
.b:hover{background:var(--ui2)}
.b.on{background:var(--ac);color:#fff}
.b svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.b.sm{width:46px}
.sep{flex:none;width:1px;height:36px;background:var(--ui2);margin:0 5px}
.sw{width:32px;height:32px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.b.col.on{background:transparent;box-shadow:inset 0 0 0 3px var(--ac)}
.dot{border-radius:50%;background:currentColor}
#zoom{width:70px;font-size:15px}
#pgl{min-width:58px;text-align:center;font-weight:600;font-size:16px}
.pop{position:fixed;background:var(--ui);color:var(--tx);border-radius:18px;box-shadow:var(--sh);padding:10px;display:none;z-index:30;gap:6px}
.pop.show{display:grid}
#shapePop{grid-template-columns:repeat(6,54px)}
#menu{width:330px;grid-template-columns:repeat(3,1fr)}
#menu h4{grid-column:1/-1;margin:6px 4px 0;font-size:13px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.bgt{height:66px;border-radius:12px;border:2px solid var(--ui2);cursor:pointer;display:flex;align-items:flex-end;justify-content:center;font-size:12px;padding:4px;font-weight:600}
.bgt.on{border-color:var(--ac)}
.mi{grid-column:1/-1;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:inherit;font:500 16px inherit;padding:12px 10px;border-radius:12px;cursor:pointer;text-align:left}
.mi:hover{background:var(--ui2)}
.mi svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mi .tg{margin-left:auto;width:42px;height:24px;border-radius:12px;background:var(--ui2);position:relative}
.mi .tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.mi.on .tg{background:var(--ac)}.mi.on .tg::after{left:21px}
#selbar{position:fixed;z-index:12;display:none}
#ed{position:fixed;display:none;z-index:15;background:transparent;border:2px dashed var(--ac);border-radius:6px;outline:0;resize:none;overflow:hidden;padding:0;line-height:1.25;font-family:"Segoe UI",system-ui,sans-serif;user-select:text;-webkit-user-select:text;white-space:pre-wrap}
#toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-20px);background:#111827;color:#fff;padding:12px 20px;border-radius:14px;font-size:16px;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
input[type=color]{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.rainbow{background:conic-gradient(red,#ff0,lime,cyan,blue,#f0f,red)}
#kb{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(1200px,100vw);background:var(--ui);box-shadow:var(--sh);border-radius:22px 22px 0 0;padding:12px 12px 16px;z-index:40;display:none;flex-direction:column;gap:8px}
body.kbon #kb{display:flex}body.kbon #tools,body.kbon #selbar{display:none!important}
.kr{display:flex;gap:8px}
.k{flex:1;min-width:0;height:64px;border:0;border-radius:13px;background:var(--ui2);color:var(--tx);font:500 25px "Segoe UI",system-ui,sans-serif;cursor:pointer;padding:0;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.k:active,.k.dn{transform:translateY(2px);box-shadow:none;filter:brightness(.9)}
.k.fn{font-size:19px;font-weight:600;flex:1.5;filter:brightness(.94)}.k.sp{flex:5}.k.ac{background:var(--ac);color:#fff;flex:1.7}.k.on{background:var(--ac);color:#fff}
@media (max-width:700px){.k{height:46px;font-size:18px}.k.fn{font-size:14px}.kr{gap:5px}#kb{padding:8px}}
#kb{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(1200px,100vw);background:var(--ui);box-shadow:var(--sh);border-radius:22px 22px 0 0;padding:12px 12px 16px;z-index:40;display:none;flex-direction:column;gap:8px}
body.kbon #kb{display:flex}body.kbon #tools,body.kbon #selbar{display:none!important}
.kr{display:flex;gap:8px}
.k{flex:1;min-width:0;height:64px;border:0;border-radius:13px;background:var(--ui2);color:var(--tx);font:500 25px "Segoe UI",system-ui,sans-serif;cursor:pointer;padding:0;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.k:active,.k.dn{transform:translateY(2px);box-shadow:none;filter:brightness(.9)}
.k.fn{font-size:19px;font-weight:600;flex:1.5;filter:brightness(.94)}.k.sp{flex:5}.k.ac{background:var(--ac);color:#fff;flex:1.7}.k.on{background:var(--ac);color:#fff}
@media (max-width:700px){.k{height:46px;font-size:18px}.k.fn{font-size:14px}.kr{gap:5px}#kb{padding:8px}}
@media (max-width:700px){.b{width:46px;height:46px}.b.sm{width:40px}#topL,#topR{top:8px}#topL{left:8px}#topR{right:8px}}
</style>
</head>
<body>
<canvas id="base"></canvas><canvas id="live"></canvas>
<div id="topL" class="bar">
  <button class="b sm" id="pgPrev" title="Oldingi sahifa"></button>
  <div id="pgl">1 / 1</div>
  <button class="b sm" id="pgNext" title="Keyingi sahifa"></button>
  <button class="b sm" id="pgAdd" title="Yangi sahifa"></button>
</div>
<div id="topR" class="bar">
  <button class="b sm" id="undo" title="Bekor qilish (Ctrl+Z)"></button>
  <button class="b sm" id="redo" title="Qaytarish (Ctrl+Y)"></button>
  <button class="b" id="zoom" title="100% ga qaytarish">100%</button>
  <button class="b sm" id="fit" title="Hammasini ko'rsatish"></button>
  <button class="b sm" id="fs" title="To'liq ekran"></button>
  <button class="b sm" id="menuBtn" title="Menyu"></button>
</div>
<div id="tools" class="bar"></div>
<div id="selbar" class="bar">
  <button class="b sm" id="sDup" title="Nusxa"></button>
  <button class="b sm" id="sFront" title="Oldinga"></button>
  <button class="b sm" id="sDel" title="O'chirish"></button>
</div>

<div id="menu" class="pop"></div>
<textarea id="ed" spellcheck="false"></textarea>
<div id="kb"></div>
<div id="toast"></div>
<input type="color" id="cpick">
<input type="file" id="fImg" accept="image/*" hidden>
<input type="file" id="fJson" accept=".json,application/json" hidden>
<script>
const $=s=>document.querySelector(s);
const base=$('#base'),live=$('#live'),bx=base.getContext('2d'),lx=live.getContext('2d'),ed=$('#ed');
const FONT='"Segoe UI",system-ui,sans-serif';
const I={
 select:'M5 3l14 8-6 2-3 6z',hand:'M8 13V5a1.5 1.5 0 013 0v6M11 11V4a1.5 1.5 0 013 0v7M14 11V5.5a1.5 1.5 0 013 0V14a6 6 0 01-6 6h-1a6 6 0 01-5-2.7L3.5 14a1.5 1.5 0 012.5-1.6L8 15',
 pen:'M4 20l4-1L19 8l-3-3L5 16zM14 7l3 3',hl:'M8 12l7-7 4 4-7 7zM8 12l-1 4 1 1 4-1M6 17l-3 3h5',
 eraser:'M8 20h12M4 16l9-9 6 6-7 7H8zM9 11l6 6',laser:'M12 12m-3 0a3 3 0 106 0a3 3 0 10-6 0M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2',
 rect:'M4 5h16v14H4z',ellipse:'M3 12a9 7 0 1018 0a9 7 0 10-18 0',tri:'M12 4l9 16H3z',line:'M5 19L19 5',arrow:'M5 19L19 5M10 5h9v9',
 fill:'M4 5h16v14H4zM4 12h16M4 9l7-4M4 16l12-11M8 19l12-11M14 19l6-4',
 text:'M5 7V4h14v3M12 4v16M9 20h6',note:'M5 4h14v10l-6 6H5zM13 20v-6h6',image:'M3 5h18v14H3zM3 16l5-5 4 4 3-3 6 6M15.5 9.5m-1.5 0a1.5 1.5 0 103 0a1.5 1.5 0 10-3 0',
 undo:'M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3',redo:'M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3',fs:'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5',menu:'M4 6h16M4 12h16M4 18h16',
 fit:'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5M9 9h6v6H9z',trash:'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3',copy:'M8 8h12v12H8zM16 8V4H4v12h4',
 front:'M8 8h12v12H8zM4 16V4h12',left:'M15 5l-7 7 7 7',right:'M9 5l7 7-7 7',plus:'M12 5v14M5 12h14',down:'M12 4v12M6 11l6 6 6-6M4 20h16',save:'M5 3h11l3 3v15H5zM8 3v6h8V3M8 21v-7h8v7',open:'M3 7h6l2 2h10v10H3zM3 7V5h6',
 brush:'M3 21c3 0 5-2 5-5l9-9-3-3-9 9c-3 0-2 4-2 8zM14 4l6 6',pencil:'M4 20l4-1L19 8l-3-3L5 16z'};
const svg=p=>`<svg viewBox="0 0 24 24"><path d="${I[p]}"/></svg>`;
const BGS={white:{c:'#ffffff',p:'none',n:'Oq'},grid:{c:'#ffffff',p:'grid',n:'Katak'},dots:{c:'#ffffff',p:'dots',n:'Nuqta'},lines:{c:'#fffdf4',p:'lines',n:'Chiziq'},chalk:{c:'#203f30',p:'none',d:1,n:'Bo\'r doska'},dark:{c:'#15181f',p:'grid',d:1,n:'Qora'}};
const COLORS=['#111827','#ffffff','#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#a855f7'];
const NOTES=['#fef08a','#bbf7d0','#bfdbfe','#fbcfe8','#fed7aa'];
const SIZES=[2,4,8,14];
let W,H,DPR,dirty=true,liveDirty=true;
let tool='pen',shapeK='rect',fillOn=false,color='#111827',sizeI=1,eraserI=1,noteI=0,penOnly=false,penSeen=false,spaceDown=false;
let lastPtr='mouse',kbLang='lat',kbShift=false,kbSym=false,kbAlways=false,kbRep;
try{kbLang=localStorage.getItem('doskaKbLang')||'lat';kbAlways=!!localStorage.getItem('doskaKbAlways')}catch(_){}
let cur=null,act=null,gest=null,sel=[],laser=[],hover=null,edObj=null,edSnap=null,lastTap={t:0,x:0,y:0};
const ptrs=new Map(),imgs={};
const newPage=()=>({objs:[],bg:'dark',v:{x:0,y:0,s:1}});
let S=(()=>{try{const d=JSON.parse(localStorage.getItem('doskaPro'));if(d&&d.pages&&d.pages.length)return d}catch(e){}return{pages:[newPage()],cur:0}})();
if(!S.dk){S.pages.forEach(p=>{if(p.bg==='grid')p.bg='dark'});S.dk=1}
const P=()=>S.pages[S.cur];
const size=()=>SIZES[sizeI];

/* ---------- saqlash / tarix ---------- */
let saveT,quotaWarned=false;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('doskaPro',JSON.stringify(S,(k,v)=>k[0]==='_'?undefined:v))}catch(e){if(!quotaWarned){quotaWarned=true;toast('Xotira to\'ldi — doskani .json qilib saqlab qo\'ying')}}},400)}
function snapshot(){const p=P();(p._u=p._u||[]).push(JSON.stringify(p.objs));if(p._u.length>150)p._u.shift();p._r=[]}
function undo(){commitEdit();const p=P();if(!p._u||!p._u.length)return;(p._r=p._r||[]).push(JSON.stringify(p.objs));p.objs=JSON.parse(p._u.pop());sel=[];changed()}
function redo(){commitEdit();const p=P();if(!p._r||!p._r.length)return;p._u.push(JSON.stringify(p.objs));p.objs=JSON.parse(p._r.pop());sel=[];changed()}
function changed(){dirty=liveDirty=true;save()}

/* ---------- geometriya ---------- */
const toW=(x,y)=>{const v=P().v;return{x:(x-v.x)/v.s,y:(y-v.y)/v.s}};
function distSeg(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy;let t=l?((px-x1)*dx+(py-y1)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-x1-t*dx,py-y1-t*dy)}
function textLines(o){return (o.s||'').split('\n')}
function measure(o){bx.save();bx.font=`${o.z}px ${FONT}`;let w=0;for(const l of textLines(o))w=Math.max(w,bx.measureText(l).width);bx.restore();return w}
function bbox(o){
 if(o.t==='stroke'){let a=1e9,b=1e9,c=-1e9,d=-1e9;const p=o.pts;for(let i=0;i<p.length;i+=2){a=Math.min(a,p[i]);c=Math.max(c,p[i]);b=Math.min(b,p[i+1]);d=Math.max(d,p[i+1])}const h=o.w/2;return{x:a-h,y:b-h,w:c-a+o.w,h:d-b+o.w}}
 if(o.t==='shape'){const h=o.w/2+(o.k==='arrow'?o.w*3+8:0);return{x:Math.min(o.x1,o.x2)-h,y:Math.min(o.y1,o.y2)-h,w:Math.abs(o.x2-o.x1)+2*h,h:Math.abs(o.y2-o.y1)+2*h}}
 if(o.t==='text')return{x:o.x,y:o.y,w:Math.max(measure(o),o.z),h:textLines(o).length*o.z*1.25};
 return{x:o.x,y:o.y,w:o.w,h:o.h};
}
const inBox=(x,y,b,m=0)=>x>=b.x-m&&x<=b.x+b.w+m&&y>=b.y-m&&y<=b.y+b.h+m;
function hit(o,x,y,r){
 if(o.t==='stroke'){const p=o.pts,rr=r+o.w/2;if(!inBox(x,y,bbox(o),r))return false;if(p.length===2)return Math.hypot(x-p[0],y-p[1])<rr;for(let i=0;i<p.length-2;i+=2)if(distSeg(x,y,p[i],p[i+1],p[i+2],p[i+3])<rr)return true;return false}
 if(o.t==='shape'){const{x1,y1,x2,y2}=o,rr=r+o.w/2;
  if(o.k==='line'||o.k==='arrow')return distSeg(x,y,x1,y1,x2,y2)<rr;
  const b={x:Math.min(x1,x2),y:Math.min(y1,y2),w:Math.abs(x2-x1),h:Math.abs(y2-y1)};
  if(o.f&&inBox(x,y,b))return true;
  if(o.k==='ellipse'){const rx=Math.max(b.w/2,1),ry=Math.max(b.h/2,1);return Math.abs(Math.hypot((x-b.x-rx)/rx,(y-b.y-ry)/ry)-1)*Math.min(rx,ry)<rr}
  const pts=o.k==='tri'?[(x1+x2)/2,y1,x2,y2,x1,y2]:[b.x,b.y,b.x+b.w,b.y,b.x+b.w,b.y+b.h,b.x,b.y+b.h];
  for(let i=0;i<pts.length;i+=2){const j=(i+2)%pts.length;if(distSeg(x,y,pts[i],pts[i+1],pts[j],pts[j+1])<rr)return true}return false}
 return inBox(x,y,bbox(o),r);
}
function move(o,dx,dy){if(o.t==='stroke'){for(let i=0;i<o.pts.length;i+=2){o.pts[i]+=dx;o.pts[i+1]+=dy}}else if(o.t==='shape'){o.x1+=dx;o.x2+=dx;o.y1+=dy;o.y2+=dy}else{o.x+=dx;o.y+=dy}}
function union(list){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const o of list){const q=bbox(o);a=Math.min(a,q.x);b=Math.min(b,q.y);c=Math.max(c,q.x+q.w);d=Math.max(d,q.y+q.h)}return list.length?{x:a,y:b,w:c-a,h:d-b}:null}
function inPoly(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){if((p[i].y>y)!==(p[j].y>y)&&x<(p[j].x-p[i].x)*(y-p[i].y)/(p[j].y-p[i].y)+p[i].x)c=!c}return c}

/* ---------- shaklni aniqlash (ushlab turish) ---------- */
function recognize(o){
 const p=o.pts,n=p.length/2;if(n<6)return null;
 let a=1e9,b=1e9,c=-1e9,d=-1e9,L=0;
 for(let i=0;i<p.length;i+=2){a=Math.min(a,p[i]);c=Math.max(c,p[i]);b=Math.min(b,p[i+1]);d=Math.max(d,p[i+1]);if(i)L+=Math.hypot(p[i]-p[i-2],p[i+1]-p[i-1])}
 const w=c-a,h=d-b,sz=Math.max(w,h);if(sz<20)return null;
 const ex=p[p.length-2],ey=p[p.length-1],dse=Math.hypot(ex-p[0],ey-p[1]);
 const B={t:'shape',c:o.c,w:Math.max(o.w,2),a:o.a};
 if(dse>0&&L/dse<1.12){let x2=ex,y2=ey;const ang=Math.atan2(y2-p[1],x2-p[0]),sn=Math.round(ang/(Math.PI/12))*(Math.PI/12);if(Math.abs(ang-sn)<.06){x2=p[0]+Math.cos(sn)*dse;y2=p[1]+Math.sin(sn)*dse}return{...B,k:'line',x1:p[0],y1:p[1],x2,y2}}
 if(dse<.3*sz){
  const rx=Math.max(w/2,1),ry=Math.max(h/2,1),cx=a+rx,cy=b+ry;let ee=0,er=0;
  for(let i=0;i<p.length;i+=2){const x=p[i],y=p[i+1];ee+=Math.abs(Math.hypot((x-cx)/rx,(y-cy)/ry)-1);er+=Math.min(Math.abs(x-a),Math.abs(x-c),Math.abs(y-b),Math.abs(y-d))/Math.min(rx,ry)}
  ee/=n;er/=n;if(Math.min(ee,er)>.28)return null;
  if(er<ee)return{...B,k:'rect',x1:a,y1:b,x2:c,y2:d};
  if(Math.abs(w-h)<.15*sz){const r=(w+h)/4;return{...B,k:'ellipse',x1:cx-r,y1:cy-r,x2:cx+r,y2:cy+r}}
  return{...B,k:'ellipse',x1:a,y1:b,x2:c,y2:d};
 }
 return null;
}

/* ---------- chizish ---------- */
function getImg(src){let im=imgs[src];if(!im){im=imgs[src]=new Image();im.onload=()=>{dirty=true};im.src=src}return im}
function wrap(c,text,maxW){const out=[];for(const para of text.split('\n')){let line='';for(const w of para.split(' ')){const t=line?line+' '+w:w;if(c.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t}out.push(line)}return out}
function drawObj(c,o){
 c.globalAlpha=o.a||1;c.strokeStyle=c.fillStyle=o.c;c.lineWidth=o.w;c.lineCap=c.lineJoin='round';
 if(o.t==='stroke'){const p=o.pts;
  if(p.length===2){c.beginPath();c.arc(p[0],p[1],o.w/2,0,7);c.fill()}
  else{c.beginPath();c.moveTo(p[0],p[1]);for(let i=2;i<p.length-2;i+=2)c.quadraticCurveTo(p[i],p[i+1],(p[i]+p[i+2])/2,(p[i+1]+p[i+3])/2);c.lineTo(p[p.length-2],p[p.length-1]);c.stroke()}}
 else if(o.t==='shape'){const{x1,y1,x2,y2}=o;c.beginPath();
  if(o.k==='rect')c.rect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1));

function delPage(){if(S.pages.length===1){if(confirm('Sahifani tozalaysizmi?')){snapshot();P().objs=[];changed()}return}if(!confirm('Shu sahifani o\'chirasizmi?'))return;S.pages.splice(S.cur,1);goPage(Math.min(S.cur,S.pages.length-1))}
function applyBg(){const d=!!(BGS[P().bg]||{}).d;document.body.classList.toggle('dark',d);document.body.style.background=(BGS[P().bg]||BGS.grid).c;
 if(d&&color==='#111827')setColor('#ffffff');if(!d&&color==='#ffffff')setColor('#111827');buildMenu();dirty=true}

/* ---------- UI ---------- */
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2600)}
function btn(parent,html,title,fn,cls='b'){const b=document.createElement('button');b.className=cls;b.innerHTML=html;b.title=title;b.onclick=fn;parent.appendChild(b);return b}
const tb=$('#tools'),toolBtns={},colBtns={},sizeBtns=[];
const sep=()=>{const s=document.createElement('div');s.className='sep';tb.appendChild(s)};
[['select','Tanlash (V)'],['hand','Surish (H)']].forEach(([t,n])=>toolBtns[t]=btn(tb,svg(t),n,()=>setTool(t)));sep();
[['pen','Qalam (P)'],['hl','Marker (M)'],['eraser','O\'chirg\'ich (E)'],['laser','Lazer ko\'rsatkich (L)']].forEach(([t,n])=>toolBtns[t]=btn(tb,svg(t),n,()=>setTool(t)));sep();
toolBtns.shape=btn(tb,svg('rect'),'Shakllar (R)',e=>{if(tool==='shape')openPop($('#shapePop'),toolBtns.shape,true);else setTool('shape')});
[['text','Matn (T)'],['note','Stiker (N)']].forEach(([t,n])=>toolBtns[t]=btn(tb,svg(t),n,()=>setTool(t)));
btn(tb,svg('image'),'Rasm qo\'yish',()=>$('#fImg').click());sep();
COLORS.forEach(c=>colBtns[c]=btn(tb,`<span class="sw" style="background:${c}"></span>`,c,()=>setColor(c),'b sm col'));
const cpb=btn(tb,'<span class="sw rainbow"></span>','Boshqa rang',()=>$('#cpick').click(),'b sm col');
$('#cpick').oninput=e=>setColor(e.target.value);sep();
SIZES.forEach((s,i)=>sizeBtns.push(btn(tb,`<span class="dot" style="width:${[6,10,16,24][i]}px;height:${[6,10,16,24][i]}px"></span>`,'Qalinlik',()=>setSize(i),'b sm')));
const sp=$('#shapePop');
['rect','ellipse','tri','line','arrow'].forEach(k=>btn(sp,svg(k),k,()=>{shapeK=k;toolBtns.shape.innerHTML=svg(k);closePops();setTool('shape');buildShapePop()},'b'));
const fillB=btn(sp,svg('fill'),'Bo\'yalgan',()=>{fillOn=!fillOn;buildShapePop()},'b');
function buildShapePop(){[...sp.children].forEach((b,i)=>b.classList.toggle('on',i<5?['rect','ellipse','tri','line','arrow'][i]===shapeK:fillOn))}
function setTool(t){commitEdit();tool=t;if(t!=='select'){sel=[]}Object.entries(toolBtns).forEach(([k,b])=>b.classList.toggle('on',k===t));base.style.cursor=t==='hand'?'grab':t==='select'?'default':t==='text'?'text':'crosshair';sizeBtns.forEach((b,j)=>b.classList.toggle('on',j===(t==='eraser'?eraserI:sizeI)));liveDirty=true}
function setColor(c){color=c;Object.entries(colBtns).forEach(([k,b])=>b.classList.toggle('on',k===c));cpb.classList.toggle('on',!colBtns[c]);
 if(sel.length){snapshot();sel.forEach(o=>{if(o.t==='note')return;o.c=c});changed()}else if(tool==='eraser'||tool==='select'||tool==='hand'||tool==='laser')setTool('pen')}
function setSize(i){if(tool==='eraser'){eraserI=i;sizeBtns.forEach((b,j)=>b.classList.toggle('on',j===i));liveDirty=true;return}sizeI=i;sizeBtns.forEach((b,j)=>b.classList.toggle('on',j===i));if(sel.length){snapshot();sel.forEach(o=>{if(o.t==='stroke'||o.t==='shape')o.w=o.a<1?SIZES[i]*3+10:SIZES[i];if(o.t==='text')o.z=SIZES[i]*5+18});changed()}liveDirty=true}
function openPop(pop,anchor,above){closePops();pop.classList.add('show');const r=anchor.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight;pop.style.left=Math.max(8,Math.min(W-pw-8,r.left+r.width/2-pw/2))+'px';pop.style.top=(above?r.top-ph-12:r.bottom+12)+'px'}
function closePops(){document.querySelectorAll('.pop.show').forEach(p=>p.classList.remove('show'))}
function buildMenu(){const m=$('#menu');m.innerHTML='<h4>Fon</h4>';
 Object.entries(BGS).forEach(([k,b])=>{const d=document.createElement('div');d.className='bgt'+(P().bg===k?' on':'');d.style.background=b.c;d.style.color=b.d?'#fff':'#111';
  if(b.p==='grid')d.style.backgroundImage=`linear-gradient(${b.d?'#ffffff22':'#0000001a'} 1px,transparent 1px),linear-gradient(90deg,${b.d?'#ffffff22':'#0000001a'} 1px,transparent 1px)`,d.style.backgroundSize='12px 12px';
  if(b.p==='dots')d.style.backgroundImage='radial-gradient(#0005 1.2px,transparent 1.3px)',d.style.backgroundSize='12px 12px';
  if(b.p==='lines')d.style.backgroundImage='linear-gradient(#3b82f655 1px,transparent 1px)',d.style.backgroundSize='12px 12px';
  d.textContent=b.n;d.onclick=()=>{P().bg=k;applyBg();save()};m.appendChild(d)});
 m.insertAdjacentHTML('beforeend','<h4>Doska</h4>');
 const mi=(ic,t,fn,tg)=>{const b=btn(m,svg(ic)+`<span>${t}</span>`+(tg!==undefined?'<span class="tg"></span>':''),t,()=>{fn();if(tg===undefined)closePops()},'mi'+(tg?' on':''));return b};
 mi('down','Rasm (PNG) qilib yuklab olish',exportPNG);
 mi('save','Doskani faylga saqlash (.json)',saveJSON);
 mi('open','Doska faylini ochish',()=>$('#fJson').click());
 mi('trash',S.pages.length>1?'Shu sahifani o\'chirish':'Sahifani tozalash',delPage);
 mi('pencil','Faqat qalam rejimi (barmoq — surish)',()=>{penOnly=!penOnly;buildMenu()},penOnly);
 mi('text','Ekran klaviaturasi (sichqoncha bilan ham)',()=>{kbAlways=!kbAlways;try{localStorage.setItem('doskaKbAlways',kbAlways?'1':'')}catch(_){}buildMenu()},kbAlways);
}

/* ---------- ekran klaviaturasi ---------- */
const KB={
 lat:[['1','2','3','4','5','6','7','8','9','0'],['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l','oʻ'],['⇧','z','x','c','v','b','n','m','gʻ','⌫']],
 cyr:[['1','2','3','4','5','6','7','8','9','0'],['й','ц','у','к','е','н','г','ш','ў','з','х','ъ'],['ф','қ','в','а','п','р','о','л','д','ж','э','ҳ'],['⇧','я','ч','с','м','и','т','ь','ғ','б','ю','⌫']],
 sym:[['1','2','3','4','5','6','7','8','9','0'],['+','-','=','×','÷','/','(',')','%','√'],['<','>','≤','≥','≠','π','²','³','°','∞'],['!','"',':',';','@','#','*','_','ʼ','⌫']]};
const kb=$('#kb');
function kbBuild(){kb.innerHTML='';const rows=kbSym?KB.sym:KB[kbLang];
 rows.concat([[kbSym?'abc':'123',kbLang==='lat'?'Кир':'Lot','◀','␣','▶',',','.','?','↵','✓']]).forEach(r=>{const d=document.createElement('div');d.className='kr';r.forEach(k=>{const b=document.createElement('button');
  const fn=['⇧','⌫','123','abc','Кир','Lot','◀','▶','↵'].includes(k);b.className='k'+(fn?' fn':'')+(k==='␣'?' sp':'')+(k==='✓'?' ac':'')+(k==='⇧'&&kbShift?' on':'');
  b.textContent=k==='␣'?'':k==='✓'?'✓ Tayyor':(kbShift&&!fn?k.toUpperCase():k);b.dataset.k=k;d.appendChild(b)});kb.appendChild(d)})}
function kbPress(k){
 const s=ed.selectionStart,e=ed.selectionEnd;
 if(k==='⌫'){if(s!==e)ed.setRangeText('',s,e,'end');else if(s>0)ed.setRangeText('',s-1,s,'end');ed.dispatchEvent(new Event('input'));return}
 if(k==='✓')return commitEdit();
 if(k==='⇧'){kbShift=!kbShift;return kbBuild()}
 if(k==='123'||k==='abc'){kbSym=!kbSym;return kbBuild()}
 if(k==='Кир'||k==='Lot'){kbLang=kbLang==='lat'?'cyr':'lat';try{localStorage.setItem('doskaKbLang',kbLang)}catch(_){}return kbBuild()}
 if(k==='◀'||k==='▶'){const p=Math.max(0,s+(k==='◀'?-1:1));ed.setSelectionRange(p,p);return}
 ed.setRangeText(k==='␣'?' ':k==='↵'?'\n':kbShift?k.toUpperCase():k,s,e,'end');ed.dispatchEvent(new Event('input'));
 if(kbShift){kbShift=false;kbBuild()}
}
kb.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();const b=e.target.closest('.k');if(!b)return;const k=b.dataset.k;b.classList.add('dn');kbPress(k);
 if(k==='⌫'||k==='◀'||k==='▶'){kbUp();kbRep=setTimeout(()=>{kbRep=setInterval(()=>kbPress(k),60)},420)}});
function kbUp(){clearTimeout(kbRep);clearInterval(kbRep);kb.querySelectorAll('.dn').forEach(b=>b.classList.remove('dn'))}
['pointerup','pointerleave','pointercancel'].forEach(t=>kb.addEventListener(t,kbUp));
function kbShow(){if(lastPtr==='mouse'&&!kbAlways){ed.inputMode='';return}ed.inputMode='none';kbShift=kbSym=false;kbBuild();document.body.classList.add('kbon');
 requestAnimationFrame(()=>{if(!edObj)return;const r=ed.getBoundingClientRect(),kt=kb.getBoundingClientRect().top;if(r.bottom>kt-16){P().v.y-=r.bottom-kt+40;viewChanged()}})}
function kbHide(){document.body.classList.remove('kbon');kbUp()}
$('#menuBtn').innerHTML=svg('menu');$('#menuBtn').onclick=e=>{e.stopPropagation();const m=$('#menu');if(m.classList.contains('show'))return closePops();buildMenu();openPop(m,$('#menuBtn'));m.style.left=W-m.offsetWidth-16+'px'};
$('#undo').innerHTML=svg('undo');$('#undo').onclick=undo;$('#redo').innerHTML=svg('redo');$('#redo').onclick=redo;
$('#fit').innerHTML=svg('fit');$('#fit').onclick=fitAll;
$('#zoom').onclick=()=>zoomAt(W/2,H/2,1/P().v.s);
$('#fs').innerHTML=svg('fs');$('#fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})};
$('#pgPrev').innerHTML=svg('left');$('#pgPrev').onclick=()=>goPage(S.cur-1);$('#pgNext').innerHTML=svg('right');$('#pgNext').onclick=()=>S.cur===S.pages.length-1?addPage():goPage(S.cur+1);$('#pgAdd').innerHTML=svg('plus');$('#pgAdd').onclick=addPage;
$('#sDel').innerHTML=svg('trash');$('#sDel').onclick=delSel;$('#sDup').innerHTML=svg('copy');$('#sDup').onclick=dupSel;$('#sFront').innerHTML=svg('front');$('#sFront').onclick=frontSel;
document.querySelectorAll('.bar,.pop').forEach(el=>el.addEventListener('pointerdown',e=>{if(!e.target.closest('#menuBtn')&&!el.classList.contains('pop')&&!e.target.closest('#tools'))closePops();if(edObj&&!el.classList.contains('pop'))commitEdit()}));

/* ---------- klaviatura ---------- */
document.addEventListener('keydown',e=>{
 if(edObj)return;const k=e.key.toLowerCase(),c=e.ctrlKey||e.metaKey;
 if(c&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}if(c&&k==='y'){e.preventDefault();redo();return}
 if(c&&k==='d'){e.preventDefault();dupSel();return}if(c&&k==='a'){e.preventDefault();setTool('select');sel=[...P().objs];liveDirty=true;return}
 if(c&&k==='s'){e.preventDefault();saveJSON();return}if(c)return;
 if(k==='delete'||k==='backspace'){delSel();return}if(k===' '){spaceDown=true;base.style.cursor='grab';return}if(k==='escape'){sel=[];closePops();liveDirty=true;return}
 const m={v:'select',h:'hand',p:'pen',m:'hl',e:'eraser',l:'laser',r:'shape',t:'text',n:'note'};if(m[k])setTool(m[k]);
 if(k>='1'&&k<='4')setSize(+k-1);if(k==='f')fitAll();if(k==='pagedown')goPage(S.cur+1);if(k==='pageup')goPage(S.cur-1);
});
document.addEventListener('keyup',e=>{if(e.key===' '){spaceDown=false;setTool(tool)}});

function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2.5);[base,live].forEach(c=>{c.width=W*DPR;c.height=H*DPR});dirty=liveDirty=true}
addEventListener('resize',resize);
document.addEventListener('gesturestart',e=>e.preventDefault());
resize();setTool('pen');setColor((BGS[P().bg]||{}).d?'#ffffff':'#111827');setSize(1);buildShapePop();pageChanged();
requestAnimationFrame(frame);
setTimeout(()=>toast('Ikki barmoq — surish va kattalashtirish. Chizib ushlab turing — shakl tekislanadi ✨'),500);
</script>
</body>
</html>
